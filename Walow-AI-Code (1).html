<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1530">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Walow AI Code</title>
<style>
:root{
  --bg:#0b1530; --bg2:#101d40; --card:#142350; --line:#233468;
  --text:#e9eeff; --muted:#93a1cf; --accent:#6c7cff; --accent2:#8b5cf6;
  --user:#2a3c8f; --bot:#132047; --danger:#ff6b81; --ok:#4cd3a0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(1200px 600px at 80% -10%,#1a2a66 0%,var(--bg) 60%);
  color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;
}
header{
  padding:10px 12px 8px;padding-top:max(10px,env(safe-area-inset-top));
  background:rgba(11,21,48,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.brand{font-weight:800;font-size:17px;letter-spacing:.3px}
.brand small{color:var(--muted);font-weight:500;font-size:11px;margin-inline-start:6px}
.icons{display:flex;gap:6px}
.ib{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;
  padding:7px 11px;font-size:13px;cursor:pointer}
.ib:active{transform:scale(.96)}
.tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer}
.tab.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
#msgs{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.hello{margin:auto;text-align:center;color:var(--muted);max-width:420px;line-height:1.9;font-size:14px}
.hello h2{color:var(--text);margin:0 0 6px;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:999px;
  padding:7px 12px;font-size:12.5px;cursor:pointer}
.m{max-width:94%;padding:10px 13px;border-radius:16px;line-height:1.85;font-size:15px;
  word-wrap:break-word;overflow-wrap:anywhere}
.m.u{align-self:flex-start;background:var(--user);border-end-start-radius:4px}
.m.b{align-self:flex-end;background:var(--bot);border:1px solid var(--line);border-end-end-radius:4px;width:100%;max-width:100%}
.m.err{border-color:var(--danger);color:#ffd5db}
.m code.i{background:#0a1331;border:1px solid var(--line);padding:1px 6px;border-radius:6px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;direction:ltr;unicode-bidi:embed}
.m h3,.m h4{margin:10px 0 4px}
.m ul{margin:6px 0;padding-inline-start:20px}
.code{margin:8px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#07102a;direction:ltr}
.ch{display:flex;justify-content:space-between;align-items:center;background:#0e1a40;
  padding:5px 10px;font-size:12px;color:var(--muted)}
.ch button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;
  padding:3px 10px;font-size:12px;cursor:pointer}
.code pre{margin:0;padding:11px;overflow-x:auto;font-size:13px;line-height:1.6;text-align:left;
  font-family:ui-monospace,Menlo,Consolas,monospace;color:#d8e2ff}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.fileTag{background:#0a1331;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;direction:ltr}
.gen img{width:100%;border-radius:12px;display:block;margin-top:6px;background:#0a1331;min-height:120px}
.gen a{display:inline-block;margin-top:6px;color:var(--accent);font-size:13px}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
footer{padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));
  background:rgba(11,21,48,.92);border-top:1px solid var(--line)}
#prev{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.pv{position:relative}
.pv img{width:54px;height:54px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.pv .fileTag{display:block;height:54px;line-height:42px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv b{position:absolute;top:-6px;inset-inline-start:-6px;width:20px;height:20px;border-radius:50%;
  background:var(--danger);color:#fff;font-size:13px;text-align:center;line-height:19px;cursor:pointer}
.row{display:flex;gap:7px;align-items:flex-end}
textarea{flex:1;resize:none;background:var(--bg2);color:var(--text);border:1px solid var(--line);
  border-radius:14px;padding:10px 12px;font:inherit;font-size:15px;max-height:140px;min-height:44px;outline:none}
textarea:focus{border-color:var(--accent)}
.btn{border:none;border-radius:13px;height:44px;min-width:44px;padding:0 14px;font-size:14px;cursor:pointer;color:#fff;font-weight:700}
#send{background:linear-gradient(135deg,var(--accent),var(--accent2))}
#send:disabled{opacity:.5}
#att{background:var(--card);border:1px solid var(--line);font-size:19px;padding:0}
.hint{text-align:center;color:var(--muted);font-size:11px;margin-top:5px}
dialog{background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:16px;
  width:min(92vw,440px);padding:16px;direction:rtl}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 10px}
dialog label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
dialog input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:10px;font-size:14px;direction:ltr;text-align:left}
.dr{display:flex;gap:8px;margin-top:14px}
.dr .btn{flex:1}
.s1{background:var(--accent)}.s2{background:var(--card);border:1px solid var(--line)}
#testOut{font-size:12.5px;margin-top:8px;line-height:1.7;word-break:break-word}
.ok{color:var(--ok)}.bad{color:var(--danger)}
</style>
<style>
/* ===== Blue theme v2 ===== */
:root{--bg:#050d24;--bg2:#0b1a42;--card:#0f2252;--line:#1f3a7d;--accent:#3d8bff;--accent2:#6b5cff;--cyan:#28d4ff;--user:#2b66ff;--bot:#0c1c46}
body{background:
  radial-gradient(900px 480px at 88% -6%,rgba(61,139,255,.30),transparent 62%),
  radial-gradient(700px 520px at -5% 105%,rgba(107,92,255,.24),transparent 60%),
  linear-gradient(180deg,#071334,#050d24)}
header{background:linear-gradient(180deg,rgba(16,36,88,.88),rgba(7,19,52,.72));
  border-bottom:1px solid rgba(90,140,255,.25);box-shadow:0 8px 32px rgba(8,28,100,.5)}
.brand{display:flex;align-items:center;gap:9px;font-size:19px}
.brand .name{background:linear-gradient(90deg,#fff,#a8c9ff 55%,#7fe3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo svg{width:36px;height:36px;display:block;filter:drop-shadow(0 4px 12px rgba(61,139,255,.65))}
.ib{background:rgba(20,45,110,.7);border-color:rgba(90,140,255,.35);border-radius:12px}
.tab{background:rgba(15,34,82,.5);border-color:rgba(90,140,255,.25);color:#a9bbe8;transition:.2s}
.tab.on{background:linear-gradient(135deg,#2f9bff,#5b4dff);box-shadow:0 4px 16px rgba(61,139,255,.5);color:#fff}
.m{animation:pop .28s ease both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.m.u{background:linear-gradient(135deg,#2f6bff,#4b4ff0);box-shadow:0 6px 20px rgba(47,107,255,.35)}
.m.b{background:linear-gradient(180deg,rgba(18,42,100,.8),rgba(10,24,66,.8));border:1px solid rgba(90,140,255,.28)}
.code{border-color:rgba(90,140,255,.3);background:#040c26}
.ch{background:#0a1a4a}
.hello .big{display:flex;justify-content:center;margin-bottom:12px}
.hello .big svg{width:104px;height:104px;filter:drop-shadow(0 10px 34px rgba(61,139,255,.75));animation:fl 4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hello h2{background:linear-gradient(90deg,#fff,#9fc8ff,#7fe3ff);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:24px}
.chip{background:rgba(20,45,110,.6);border-color:rgba(90,140,255,.35)}
footer{background:transparent;border-top:none;padding-top:2px}
.row{background:rgba(14,32,80,.78);border:1px solid rgba(90,140,255,.32);border-radius:26px;padding:6px;
  backdrop-filter:blur(10px);box-shadow:0 10px 34px rgba(4,14,60,.7);align-items:center;transition:.2s}
.row:focus-within{border-color:#4d9bff;box-shadow:0 0 0 3px rgba(61,139,255,.25),0 10px 34px rgba(4,14,60,.7)}
textarea{background:transparent;border:none;border-radius:0;padding:10px 6px}
textarea:focus{border:none}
#send,#att{width:44px;height:44px;min-width:44px;padding:0;border-radius:50%;display:grid;place-items:center}
#send{background:linear-gradient(135deg,#2fb7ff,#5b4dff);box-shadow:0 4px 16px rgba(61,139,255,.55)}
#send svg{width:21px;height:21px}
#att{background:rgba(25,55,125,.7);border:1px solid rgba(90,140,255,.35)}
dialog{background:linear-gradient(180deg,#0e2050,#091638);border-color:rgba(90,140,255,.4);box-shadow:0 20px 60px rgba(0,10,50,.8)}
.s1{background:linear-gradient(135deg,#2f9bff,#5b4dff)}
</style>
<style>
.qrow{margin-top:8px}
#quick,#prov{width:100%;background:rgba(20,45,110,.7);color:var(--text);border:1px solid rgba(90,140,255,.35);border-radius:12px;padding:9px 10px;font-size:13px;direction:ltr;text-align:left}
#prov{direction:rtl;text-align:right}
#quick option,#prov option{background:#0b1a42;color:#e9eeff}
dialog{max-height:92dvh;overflow-y:auto}
#orBox{margin-top:10px}
#orBox input[type=text]{width:100%}
#orRow{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:6px 0}
#orRow label{display:flex;align-items:center;gap:6px;margin:0;color:var(--text)}
#orFree{width:auto}
#orList{max-height:190px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:4px;font-size:12.5px;color:var(--muted);text-align:center}
.orm{display:flex;justify-content:space-between;gap:6px;width:100%;background:transparent;color:var(--text);border:none;border-radius:8px;padding:8px;text-align:left;cursor:pointer;font-size:12.5px;direction:ltr}
.orm.on{background:rgba(61,139,255,.3)}
.orm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orm i{font-style:normal;color:#4cd3a0;font-size:11px;margin-inline-start:6px;white-space:nowrap}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand"><span class="logo" id="hLogo"></span><span class="name">Walow AI Code</span><small>v1.1</small></div>
    <div class="icons">
      <button class="ib" id="newChat">+ جديد</button>
      <button class="ib" id="openSet">⚙ الإعدادات</button>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-m="chat">💬 دردشة</button>
    <button class="tab" data-m="code">👨‍💻 مبرمج</button>
    <button class="tab" data-m="analyze">🔍 تحليل كود</button>
  </div>
  <div class="qrow"><select id="quick" aria-label="النموذج"></select></div>
</header>

<div id="msgs"></div>

<footer>
  <div id="prev"></div>
  <div class="row">
    <button class="btn" id="att" title="إرفاق صورة أو ملف">📎</button>
    <textarea id="inp" rows="1" placeholder="اكتب سؤالك..."></textarea>
    <button class="btn" id="send" aria-label="إرسال"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div>
  <div class="hint" id="hint"></div>
  <input type="file" id="file" multiple hidden
    accept="image/*,text/*,.py,.js,.ts,.jsx,.tsx,.html,.css,.json,.java,.kt,.cs,.cpp,.c,.h,.php,.md,.xml,.yml,.yaml,.gd,.mymw,.sh,.sql,.dart,.go,.rs,.swift">
</footer>

<dialog id="dlg">
  <h3>⚙ الإعدادات</h3>
  <label>المزوّد</label>
  <select id="prov">
    <option value="gemini">Gemini (مباشر)</option>
    <option value="openrouter">OpenRouter — Claude وGrok وLlama وغيرها</option>
    <option value="anthropic">Claude (مباشر)</option>
  </select>
  <label>المفتاح (API Key)</label>
  <input id="key" type="password" autocomplete="off" placeholder="الصق المفتاح هنا">
  <div class="hint" id="keyHelp" style="text-align:right"></div>
  <label>النموذج</label>
  <input id="model" list="models" placeholder="اسم النموذج" autocomplete="off">
  <datalist id="models"></datalist>
  <div id="orBox" hidden>
    <input id="orq" type="text" placeholder="ابحث: grok / llama / claude / gemini" autocomplete="off">
    <div id="orRow">
      <label><input type="checkbox" id="orFree" checked> مجاني فقط</label>
      <button type="button" class="ib" id="orReload">تحديث القائمة</button>
    </div>
    <div id="orList"></div>
  </div>
  <div id="testOut"></div>
  <div class="dr">
    <button class="btn s2" id="test">اختبار المفتاح</button>
    <button class="btn s1" id="saveSet">حفظ</button>
  </div>
  <div class="hint" style="margin-top:10px">المفتاح يُحفظ في متصفحك أنت فقط ولا يُرسل إلا إلى المزوّد الذي تختاره.</div>
  <div class="dr"><button class="btn s2" id="closeSet">إغلاق</button></div>
</dialog>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const API="https://generativelanguage.googleapis.com/v1beta/models";
const LS={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const OWNER="محمد ولو أبو يوسف";
const SYS={
  chat:`أنت "Walow AI Code"، مساعد ذكي عربي طوّره ${OWNER}. أجب بوضوح وبالعربية ما لم يطلب المستخدم لغة أخرى. إذا سُئلت من أنت فعرّف بنفسك بإيجاز.`,
  code:`أنت "Walow AI Code"، مهندس برمجيات خبير طوّره ${OWNER}. مهمتك كتابة أكواد كاملة وجاهزة للتشغيل لجميع أنواع التطبيقات (ويب، أندرويد، ألعاب، سكربتات، APIs).
- اشرح بالعربية باختصار، واكتب الكود داخل كتل \`\`\`لغة.
- اكتب الملفات كاملة لا مقتطفات، وسمِّ كل ملف باسمه قبل كتلة الكود.
- اذكر خطوات التشغيل بعد الكود، وما يحتاج تثبيتاً.
- لا تخترع مكتبات أو دوال غير موجودة؛ إذا لم تكن متأكداً فقل ذلك.`,
  analyze:`أنت "Walow AI Code"، محلل أكواد ومراجع خبير طوّره ${OWNER}. عند استلام كود أو صورة خطأ:
1) اشرح ما يفعله الكود باختصار.
2) اذكر الأخطاء والمشاكل (منطقية، أمنية، أداء) مرتبة بالأهمية مع السبب.
3) قدّم النسخة المُصلَحة داخل كتلة كود.
اكتب بالعربية.`
};
const HINTS={chat:"دردشة عامة",code:"وضع المبرمج: يكتب أكواداً كاملة",analyze:"ألصق الكود أو أرفق ملفه أو صورة الخطأ"};
const PH={chat:"اكتب سؤالك...",code:"ماذا تريد أن نبني؟",analyze:"ألصق الكود هنا أو أرفق ملفاً..."};

let mode=LS.get("wac_mode","chat");
if(!["chat","code","analyze"].includes(mode))mode="chat";
let history=[];      // {role, parts}
let pending=[];      // attachments
let busy=false;

/* ---------- helpers ---------- */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function inline(t){
  t=esc(t);
  t=t.replace(/`([^`\n]+)`/g,'<code class="i">$1</code>');
  t=t.replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>");
  const lines=t.split("\n");let out="",inList=false;
  for(const ln of lines){
    let m;
    if((m=ln.match(/^\s*[-*•]\s+(.*)$/))||(m=ln.match(/^\s*\d+[.)]\s+(.*)$/))){
      if(!inList){out+="<ul>";inList=true}
      out+="<li>"+m[1]+"</li>";continue;
    }
    if(inList){out+="</ul>";inList=false}
    if((m=ln.match(/^#{1,2}\s+(.*)$/)))out+="<h3>"+m[1]+"</h3>";
    else if((m=ln.match(/^#{3,6}\s+(.*)$/)))out+="<h4>"+m[1]+"</h4>";
    else out+=ln+"<br>";
  }
  if(inList)out+="</ul>";
  return out.replace(/(<br>)+$/,"");
}
function render(text){
  let html="",last=0;
  const re=/```([\w+#.-]*)[^\S\n]*\n?([\s\S]*?)(?:```|$)/g;let m;
  while((m=re.exec(text))!==null){
    html+=inline(text.slice(last,m.index));
    html+=`<div class="code"><div class="ch"><span>${esc(m[1]||"code")}</span><button data-copy>نسخ</button></div><pre><code>${esc(m[2].replace(/\n$/,""))}</code></pre></div>`;
    last=re.lastIndex;
    if(m[0]==="")re.lastIndex++;
  }
  html+=inline(text.slice(last));
  return html;
}
function scrollDown(){const e=$("#msgs");e.scrollTop=e.scrollHeight}
function clearHello(){const h=$("#msgs .hello");if(h)h.remove()}
function addMsg(cls,html){
  clearHello();
  const d=document.createElement("div");d.className="m "+cls;d.innerHTML=html;
  $("#msgs").appendChild(d);scrollDown();return d;
}
function showHello(){
  const e=$("#msgs");e.innerHTML="";
  const d=document.createElement("div");d.className="hello";
  d.innerHTML=`<div class="big">${logoSVG("hl",112,true)}</div><h2>مرحباً بك 👋</h2>أنا Walow AI Code، أكتب لك الأكواد، أحلّلها، وأفسّر لك الصور.
  <div class="chips">
    <span class="chip" data-q="اكتب لي صفحة HTML لآلة حاسبة بتصميم جميل">آلة حاسبة HTML</span>
    <span class="chip" data-q="اشرح لي الفرق بين let و const و var في جافاسكربت">let / const / var</span>
    <span class="chip" data-q="اكتب سكربت بايثون يغيّر أسماء ملفات مجلد كامل">سكربت بايثون</span>
  </div>`;
  e.appendChild(d);
}
function setMode(m){
  mode=m;LS.set("wac_mode",m);
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.m===m));
  $("#inp").placeholder=PH[m];$("#hint").textContent=HINTS[m];
}

/* ---------- save / load ---------- */
function save(){
  try{
    const slim=history.map(h=>({role:h.role,parts:h.parts.map(p=>p.inlineData?{text:"[صورة مرفقة]"}:p)}));
    LS.set("wac_hist",JSON.stringify(slim));
  }catch(e){}
}
function load(){
  try{history=JSON.parse(LS.get("wac_hist","[]"))||[]}catch(e){history=[]}
  if(!history.length){showHello();return}
  $("#msgs").innerHTML="";
  for(const h of history){
    const txt=h.parts.map(p=>p.text||"").join("\n");
    if(h.role==="user")addMsg("u",esc(txt).replace(/\n/g,"<br>"));
    else addMsg("b",render(txt));
  }
}

/* ---------- attachments ---------- */
function refreshPrev(){
  const p=$("#prev");p.innerHTML="";
  pending.forEach((a,i)=>{
    const w=document.createElement("div");w.className="pv";
    w.innerHTML=a.kind==="image"?`<img src="${a.url}">`:`<span class="fileTag">${esc(a.name)}</span>`;
    const x=document.createElement("b");x.textContent="×";x.onclick=()=>{pending.splice(i,1);refreshPrev()};
    w.appendChild(x);p.appendChild(w);

function readImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("تعذّرت قراءة الصورة"));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error("صيغة الصورة غير مدعومة"));
      img.onload=()=>{
        const MAX=1600;let w=img.width,h=img.height;
        const k=Math.min(1,MAX/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
        const c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        const url=c.toDataURL("image/jpeg",.85);
        res({kind:"image",mime:"image/jpeg",data:url.split(",")[1],url});
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function readText(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("تعذّرت قراءة الملف"));
    fr.onload=()=>res({kind:"text",name:file.name,text:String(fr.result).slice(0,200000)});
    fr.readAsText(file);
  });
}
async function onFiles(files){
  for(const f of files){
    try{
      if(f.type.startsWith("image/"))pending.push(await readImage(f));
      else pending.push(await readText(f));
    }catch(e){addMsg("b err",esc(e.message))}
  }
  refreshPrev();
}

function explainError(status,msg){
  let tip="";
  if(/API key not valid|API_KEY_INVALID/i.test(msg))tip="المفتاح غير صالح. أنشئ مفتاحاً جديداً وتأكد أنه للمزوّد المختار.";
  else if(status===401||status===403)tip="المفتاح مرفوض أو لا يملك صلاحية. تأكد أنه مفتاح المزوّد المختار.";
  else if(status===402)tip="رصيدك لا يكفي لهذا النموذج. اختر نموذجاً مجانياً أو اشحن الرصيد.";
  else if(status===404)tip="اسم النموذج غير صحيح أو لم يعد متاحاً. اختر نموذجاً آخر من ⚙ الإعدادات.";
  else if(status===429)tip="تجاوزت الحد المسموح. انتظر قليلاً أو جرّب نموذجاً آخر.";
  else if(status===400)tip="الطلب مرفوض (ربما الملف كبير، أو النموذج لا يدعم الصور، أو المفتاح خاطئ).";
  else if(status>=500)tip="مشكلة مؤقتة عند المزوّد. أعد المحاولة بعد قليل.";
  return `<b>خطأ ${status||""}</b><br>${tip}<br><small dir="ltr" style="color:#ffb3be">${esc(msg||"")}</small>`;
}
async function readSSE(res,onData){
  const reader=res.body.getReader();const dec=new TextDecoder();let buf="";
  while(true){
    const {done,value}=await reader.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf("\n"))>=0){
      const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
      if(!line.startsWith("data:"))continue;
      const js=line.slice(5).trim();if(!js||js==="[DONE]")continue;
      let j;try{j=JSON.parse(js)}catch(e){continue}
      onData(j);
    }
  }
}
async function streamAI(onText,modelOverride){
  const p=getProv(),key=getKey(p).trim(),model=(modelOverride||getModel(p)).trim();
  const sys=(SYS[mode]||SYS.chat)+"\nالنموذج الذي يشغّلك حالياً: "+model+".";
  let url,headers,body;
  if(p==="gemini"){
    url=`${API}/${encodeURIComponent(model)}:streamGenerateContent?alt=sse`;
    headers={"Content-Type":"application/json","x-goog-api-key":key};
    body={systemInstruction:{parts:[{text:sys}]},contents:history,
      generationConfig:{temperature:mode==="chat"?0.8:0.4}};
  }else if(p==="openrouter"){
    url="https://openrouter.ai/api/v1/chat/completions";
    headers={"Content-Type":"application/json","Authorization":"Bearer "+key,"X-Title":"Walow AI Code"};
    body={model,stream:true,messages:[{role:"system",content:sys}].concat(toOpenAI())};
  }else{
    url="https://api.anthropic.com/v1/messages";
    headers={"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"};
    body={model,max_tokens:8192,stream:true,system:sys,messages:toAnthropic()};
  }
  let res;
  try{res=await fetch(url,{method:"POST",headers,body:JSON.stringify(body)})}
  catch(e){const err=new Error("تعذّر الاتصال بالإنترنت أو بالمزوّد.");err.status=0;throw err}
  if(!res.ok){
    let msg="";
    try{const j=await res.json();msg=(j.error&&j.error.message)||JSON.stringify(j)}catch(e){msg=res.statusText}
    const err=new Error(msg);err.status=res.status;throw err;
  }
  let full="",blocked="";
  await readSSE(res,j=>{
    if(p==="gemini"){
      if(j.promptFeedback&&j.promptFeedback.blockReason)blocked=j.promptFeedback.blockReason;
      const c=j.candidates&&j.candidates[0];
      if(c&&c.content&&c.content.parts){for(const q of c.content.parts){if(q.text){full+=q.text;onText(full)}}}
    }else if(p==="openrouter"){
      if(j.error){const er=new Error(j.error.message||"خطأ");er.status=Number(j.error.code)||0;throw er}
      const d=j.choices&&j.choices[0]&&j.choices[0].delta;
      if(d&&d.content){full+=d.content;onText(full)}
    }else{
      if(j.type==="error"){const er=new Error((j.error&&j.error.message)||"خطأ");er.status=0;throw er}
      if(j.type==="content_block_delta"&&j.delta&&j.delta.type==="text_delta"){full+=j.delta.text;onText(full)}
    }
  });
  if(!full&&blocked){const err=new Error("حُجب الطلب: "+blocked);err.status=400;throw err}
  if(!full){const err=new Error("لم يصل رد من النموذج.");err.status=0;throw err}
  return full;
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function streamWithRetry(onText,bot){
  const p=getProv(),main=getModel(p);
  const chain=[main];
  if(p==="gemini")["gemini-3.6-flash","gemini-3.5-flash-lite"].forEach(m=>{if(m!==main)chain.push(m)});
  const retryable=[429,500,502,503,504];
  let lastErr;
  for(let k=0;k<chain.length;k++){
    for(let t=0;t<2;t++){
      try{
        const txt=await streamAI(onText,chain[k]);
        bot.dataset.model=chain[k];
        return txt;
      }catch(e){
        lastErr=e;
        if(!retryable.includes(e.status))throw e;
        const last=(k===chain.length-1&&t===1);
        if(!last){
          bot.innerHTML='<span class="dots"><span></span><span></span><span></span></span> الخدمة مشغولة، نحاول مجدداً...';
          await sleep(1500*(t+1));
        }
      }
    }
  }
  throw lastErr;
}

/* ---------- send ---------- */
async function send(){
  if(busy)return;
  const inp=$("#inp");let text=inp.value.trim();
  if(!text&&!pending.length)return;
  if(!getKey(getProv()).trim()){
    addMsg("b err","أدخل مفتاح المزوّد أولاً من ⚙ الإعدادات.");openSettings();return;
  }
  if(!getModel(getProv()).trim()){
    addMsg("b err","اختر نموذجاً من ⚙ الإعدادات.");openSettings();return;
  }
  if(!text&&mode==="analyze")text="حلّل هذا وأصلح أي مشاكل فيه.";
  if(!text)text="ما الموجود في هذا المرفق؟ اشرحه لي.";

  const parts=[];let thumbs="",tags="";
  for(const a of pending){
    if(a.kind==="image"){parts.push({inlineData:{mimeType:a.mime,data:a.data}});thumbs+=`<img src="${a.url}">`}
    else{parts.push({text:`الملف: ${a.name}\n\`\`\`\n${a.text}\n\`\`\``});tags+=`<span class="fileTag">${esc(a.name)}</span> `}
  }
  parts.push({text});
  history.push({role:"user",parts});
  const hadPending=pending.slice();
  addMsg("u",(thumbs?`<div class="thumbs">${thumbs}</div>`:"")+(tags?`<div class="thumbs">${tags}</div>`:"")+esc(text).replace(/\n/g,"<br>"));
  inp.value="";inp.style.height="auto";pending=[];refreshPrev();

  const bot=addMsg("b",'<span class="dots"><span></span><span></span><span></span></span>');
  busy=true;$("#send").disabled=true;
  try{
    const full=await streamWithRetry(t=>{bot.innerHTML=render(t);scrollDown()},bot);
    const um=bot.dataset.model;
    if(um&&um!==getModel(getProv()))bot.insertAdjacentHTML("beforeend","<div class=\"hint\" dir=\"ltr\">answered by "+esc(um)+" (main model was busy)</div>");
    history.push({role:"model",parts:[{text:full}]});
    save();
  }catch(e){
    history.pop();
    bot.className="m b err";bot.innerHTML=explainError(e.status,e.message);
    inp.value=text;pending=hadPending;refreshPrev();
  }finally{
    busy=false;$("#send").disabled=false;scrollDown();
  }
}
