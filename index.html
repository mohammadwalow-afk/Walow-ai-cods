<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1530">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Walow AI Code</title>
<style>
:root{
  --bg:#0b1530; --bg2:#101d40; --card:#142350; --line:#233468;
  --text:#e9eeff; --muted:#93a1cf; --accent:#6c7cff; --accent2:#8b5cf6;
  --user:#2a3c8f; --bot:#132047; --danger:#ff6b81; --ok:#4cd3a0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(1200px 600px at 80% -10%,#1a2a66 0%,var(--bg) 60%);
  color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;
}
header{
  padding:10px 12px 8px;padding-top:max(10px,env(safe-area-inset-top));
  background:rgba(11,21,48,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.brand{font-weight:800;font-size:17px;letter-spacing:.3px}
.brand small{color:var(--muted);font-weight:500;font-size:11px;margin-inline-start:6px}
.icons{display:flex;gap:6px}
.ib{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;
  padding:7px 11px;font-size:13px;cursor:pointer}
.ib:active{transform:scale(.96)}
.tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer}
.tab.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
#msgs{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.hello{margin:auto;text-align:center;color:var(--muted);max-width:420px;line-height:1.9;font-size:14px}
.hello h2{color:var(--text);margin:0 0 6px;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:999px;
  padding:7px 12px;font-size:12.5px;cursor:pointer}
.m{max-width:94%;padding:10px 13px;border-radius:16px;line-height:1.85;font-size:15px;
  word-wrap:break-word;overflow-wrap:anywhere}
.m.u{align-self:flex-start;background:var(--user);border-end-start-radius:4px}
.m.b{align-self:flex-end;background:var(--bot);border:1px solid var(--line);border-end-end-radius:4px;width:100%;max-width:100%}
.m.err{border-color:var(--danger);color:#ffd5db}
.m code.i{background:#0a1331;border:1px solid var(--line);padding:1px 6px;border-radius:6px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;direction:ltr;unicode-bidi:embed}
.m h3,.m h4{margin:10px 0 4px}
.m ul{margin:6px 0;padding-inline-start:20px}
.code{margin:8px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#07102a;direction:ltr}
.ch{display:flex;justify-content:space-between;align-items:center;background:#0e1a40;
  padding:5px 10px;font-size:12px;color:var(--muted)}
.ch button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;
  padding:3px 10px;font-size:12px;cursor:pointer}
.code pre{margin:0;padding:11px;overflow-x:auto;font-size:13px;line-height:1.6;text-align:left;
  font-family:ui-monospace,Menlo,Consolas,monospace;color:#d8e2ff}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.fileTag{background:#0a1331;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;direction:ltr}
.gen img{width:100%;border-radius:12px;display:block;margin-top:6px;background:#0a1331;min-height:120px}
.gen a{display:inline-block;margin-top:6px;color:var(--accent);font-size:13px}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
footer{padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));
  background:rgba(11,21,48,.92);border-top:1px solid var(--line)}
#prev{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.pv{position:relative}
.pv img{width:54px;height:54px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.pv .fileTag{display:block;height:54px;line-height:42px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv b{position:absolute;top:-6px;inset-inline-start:-6px;width:20px;height:20px;border-radius:50%;
  background:var(--danger);color:#fff;font-size:13px;text-align:center;line-height:19px;cursor:pointer}
.row{display:flex;gap:7px;align-items:flex-end}
textarea{flex:1;resize:none;background:var(--bg2);color:var(--text);border:1px solid var(--line);
  border-radius:14px;padding:10px 12px;font:inherit;font-size:15px;max-height:140px;min-height:44px;outline:none}
textarea:focus{border-color:var(--accent)}
.btn{border:none;border-radius:13px;height:44px;min-width:44px;padding:0 14px;font-size:14px;cursor:pointer;color:#fff;font-weight:700}
#send{background:linear-gradient(135deg,var(--accent),var(--accent2))}
#send:disabled{opacity:.5}
#att{background:var(--card);border:1px solid var(--line);font-size:19px;padding:0}
.hint{text-align:center;color:var(--muted);font-size:11px;margin-top:5px}
dialog{background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:16px;
  width:min(92vw,440px);padding:16px;direction:rtl}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 10px}
dialog label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
dialog input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:10px;font-size:14px;direction:ltr;text-align:left}
.dr{display:flex;gap:8px;margin-top:14px}
.dr .btn{flex:1}
.s1{background:var(--accent)}.s2{background:var(--card);border:1px solid var(--line)}
#testOut{font-size:12.5px;margin-top:8px;line-height:1.7;word-break:break-word}
.ok{color:var(--ok)}.bad{color:var(--danger)}
</style>
<style>
/* ===== Blue theme v2 ===== */
:root{--bg:#050d24;--bg2:#0b1a42;--card:#0f2252;--line:#1f3a7d;--accent:#3d8bff;--accent2:#6b5cff;--cyan:#28d4ff;--user:#2b66ff;--bot:#0c1c46}
body{background:
  radial-gradient(900px 480px at 88% -6%,rgba(61,139,255,.30),transparent 62%),
  radial-gradient(700px 520px at -5% 105%,rgba(107,92,255,.24),transparent 60%),
  linear-gradient(180deg,#071334,#050d24)}
header{background:linear-gradient(180deg,rgba(16,36,88,.88),rgba(7,19,52,.72));
  border-bottom:1px solid rgba(90,140,255,.25);box-shadow:0 8px 32px rgba(8,28,100,.5)}
.brand{display:flex;align-items:center;gap:9px;font-size:19px}
.brand .name{background:linear-gradient(90deg,#fff,#a8c9ff 55%,#7fe3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo svg{width:36px;height:36px;display:block;filter:drop-shadow(0 4px 12px rgba(61,139,255,.65))}
.ib{background:rgba(20,45,110,.7);border-color:rgba(90,140,255,.35);border-radius:12px}
.tab{background:rgba(15,34,82,.5);border-color:rgba(90,140,255,.25);color:#a9bbe8;transition:.2s}
.tab.on{background:linear-gradient(135deg,#2f9bff,#5b4dff);box-shadow:0 4px 16px rgba(61,139,255,.5);color:#fff}
.m{animation:pop .28s ease both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.m.u{background:linear-gradient(135deg,#2f6bff,#4b4ff0);box-shadow:0 6px 20px rgba(47,107,255,.35)}
.m.b{background:linear-gradient(180deg,rgba(18,42,100,.8),rgba(10,24,66,.8));border:1px solid rgba(90,140,255,.28)}
.code{border-color:rgba(90,140,255,.3);background:#040c26}
.ch{background:#0a1a4a}
.hello .big{display:flex;justify-content:center;margin-bottom:12px}
.hello .big svg{width:104px;height:104px;filter:drop-shadow(0 10px 34px rgba(61,139,255,.75));animation:fl 4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hello h2{background:linear-gradient(90deg,#fff,#9fc8ff,#7fe3ff);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:24px}
.chip{background:rgba(20,45,110,.6);border-color:rgba(90,140,255,.35)}
footer{background:transparent;border-top:none;padding-top:2px}
.row{background:rgba(14,32,80,.78);border:1px solid rgba(90,140,255,.32);border-radius:26px;padding:6px;
  backdrop-filter:blur(10px);box-shadow:0 10px 34px rgba(4,14,60,.7);align-items:center;transition:.2s}
.row:focus-within{border-color:#4d9bff;box-shadow:0 0 0 3px rgba(61,139,255,.25),0 10px 34px rgba(4,14,60,.7)}
textarea{background:transparent;border:none;border-radius:0;padding:10px 6px}
textarea:focus{border:none}
#send,#att{width:44px;height:44px;min-width:44px;padding:0;border-radius:50%;display:grid;place-items:center}
#send{background:linear-gradient(135deg,#2fb7ff,#5b4dff);box-shadow:0 4px 16px rgba(61,139,255,.55)}
#send svg{width:21px;height:21px}
#att{background:rgba(25,55,125,.7);border:1px solid rgba(90,140,255,.35)}
dialog{background:linear-gradient(180deg,#0e2050,#091638);border-color:rgba(90,140,255,.4);box-shadow:0 20px 60px rgba(0,10,50,.8)}
.s1{background:linear-gradient(135deg,#2f9bff,#5b4dff)}
</style>
<style>
.qrow{margin-top:8px}
#quick,#prov{width:100%;background:rgba(20,45,110,.7);color:var(--text);border:1px solid rgba(90,140,255,.35);border-radius:12px;padding:9px 10px;font-size:13px;direction:ltr;text-align:left}
#prov{direction:rtl;text-align:right}
#quick option,#prov option{background:#0b1a42;color:#e9eeff}
dialog{max-height:92dvh;overflow-y:auto}
#orBox{margin-top:10px}
#orBox input[type=text]{width:100%}
#orRow{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:6px 0}
#orRow label{display:flex;align-items:center;gap:6px;margin:0;color:var(--text)}
#orFree{width:auto}
#orList{max-height:190px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:4px;font-size:12.5px;color:var(--muted);text-align:center}
.orm{display:flex;justify-content:space-between;gap:6px;width:100%;background:transparent;color:var(--text);border:none;border-radius:8px;padding:8px;text-align:left;cursor:pointer;font-size:12.5px;direction:ltr}
.orm.on{background:rgba(61,139,255,.3)}
.orm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orm i{font-style:normal;color:#4cd3a0;font-size:11px;margin-inline-start:6px;white-space:nowrap}
</style>
<style>
/* ===== v1.2 ===== */
.lhs{display:flex;align-items:center;gap:8px;min-width:0}
.brand{font-size:17px}
.brand .name{white-space:nowrap}
.ib{font-size:16px;padding:6px 12px}
.m table{border-collapse:collapse;font-size:13.5px;min-width:100%}
.tw{overflow-x:auto;margin:8px 0}
.m th,.m td{border:1px solid var(--line);padding:6px 9px;text-align:start}
.m th{background:#0a1a4a}
.ch .bt{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.acts button{background:transparent;border:1px solid rgba(90,140,255,.3);color:var(--muted);border-radius:9px;padding:4px 10px;font-size:12px;cursor:pointer}
.acts button:active{transform:scale(.96)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(86vw,340px);z-index:21;
  background:linear-gradient(180deg,#0e2050,#071334);border-inline-end:1px solid rgba(90,140,255,.35);
  transform:translateX(105%);transition:transform .28s ease;display:flex;flex-direction:column;gap:10px;
  padding:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom));box-shadow:0 0 40px rgba(0,0,0,.6)}
#drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;font-size:17px}
.btn.full{width:100%}
#cq{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14px;outline:none}
#clist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.ci{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border:1px solid rgba(90,140,255,.2);border-radius:12px;background:rgba(15,34,82,.5);cursor:pointer}
.ci.on{border-color:#4d9bff;background:rgba(47,107,255,.3)}
.ct{min-width:0;flex:1}
.ct b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct small{color:var(--muted);font-size:11px}
.ca{display:flex;gap:2px}
.ca button{background:transparent;border:none;color:var(--text);font-size:15px;padding:5px 7px;cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:24px 10px;font-size:13px}
.df{display:flex;gap:6px}.df .ib{flex:1;font-size:13px}
#pvBox{position:fixed;inset:0;background:#050d24;z-index:30;display:none;flex-direction:column}
#pvBox.open{display:flex}
.pvh{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
#pvFrame{flex:1;border:none;background:#fff;width:100%}
#toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%) translateY(10px);background:#0e2a6e;border:1px solid rgba(90,140,255,.5);
  color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.sp{display:block;height:7px}
.lnk{background:rgba(47,107,255,.25);border:1px solid rgba(90,140,255,.5);color:var(--text);border-radius:999px;padding:6px 13px;font-size:13px;margin:4px 3px;cursor:pointer;font-family:inherit}
.tip{display:block;margin-top:10px;font-size:12px;color:var(--muted)}
</style>
<style>
/* ===== related images ===== */
.gal{margin-top:12px;border-top:1px solid rgba(90,140,255,.25);padding-top:10px}
.gh{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.gs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.gs figure{margin:0;flex:0 0 74%;max-width:300px;scroll-snap-align:start;cursor:pointer;background:#07102a;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gs img{width:100%;height:170px;object-fit:cover;display:block;background:#0a1331}
.gs figcaption{padding:7px 9px;font-size:12px;line-height:1.6;color:#c6d3ff;direction:ltr;text-align:left;max-height:4.9em;overflow:hidden}
.gf{font-size:11px;color:var(--muted);margin-top:4px}
#sk{position:fixed;inset:0;background:rgba(5,13,36,.97);z-index:36;display:none;flex-direction:column;gap:10px;padding:14px;overflow-y:auto}
#sk.open{display:flex}
#sk h3{margin:0;font-size:17px}
#sk .skb{display:flex;gap:8px;flex-wrap:wrap}
#sk .skb button,#sk .skb label{flex:1;min-width:120px;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;text-align:center;cursor:pointer}
#sk .skb .go{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;font-weight:700}
#sk .skim{display:grid;grid-template-columns:1fr;gap:10px}
#sk .skim figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
#sk .skim img{max-width:100%;max-height:44vh;border-radius:8px}
#sk figcaption{font-size:12px;color:var(--muted);margin-top:4px}
#skn{width:100%;box-sizing:border-box;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
#skst{font-size:13px;color:var(--muted);min-height:20px;line-height:1.7}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:35;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px}
#lb.open{display:flex}
#lbi{max-width:100%;max-height:62vh;border-radius:12px;object-fit:contain}
#lbc{max-width:92vw;color:#dfe7ff;font-size:13px;line-height:1.7;text-align:left;direction:ltr;max-height:24vh;overflow-y:auto}
#lbc a{color:#7fb2ff}
#imgOn{width:auto;margin-inline-end:8px;vertical-align:middle}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="lhs">
      <button class="ib" id="menu" aria-label="المحادثات" title="المحادثات">☰</button>
      <div class="brand"><span class="logo" id="hLogo"></span><span class="name">Walow AI Code</span></div>
    </div>
    <div class="icons">
      <button class="ib" id="newChat" aria-label="محادثة جديدة" title="محادثة جديدة">＋</button>
      <button class="ib" id="openSet" aria-label="الإعدادات" title="الإعدادات">⚙</button>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-m="chat">💬 دردشة</button>
    <button class="tab" data-m="code">👨‍💻 مبرمج</button>
    <button class="tab" data-m="analyze">🔍 تحليل كود</button>
  </div>
  <div class="qrow"><select id="quick" aria-label="النموذج"></select></div>
</header>

<div id="msgs"></div>

<footer>
  <div id="prev"></div>
  <div class="row">
    <button class="btn" id="att" title="إرفاق صورة أو ملف">📎</button>
    <button class="btn" id="skOpen" title="تحويل رسم إلى صورة واقعية">🎨</button>
    <textarea id="inp" rows="1" placeholder="اكتب سؤالك..."></textarea>
    <button class="btn" id="send" aria-label="إرسال"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div>
  <div class="hint" id="hint"></div>
  <input type="file" id="file" multiple hidden
    accept="image/*,text/*,.py,.js,.ts,.jsx,.tsx,.html,.css,.json,.java,.kt,.cs,.cpp,.c,.h,.php,.md,.xml,.yml,.yaml,.gd,.mymw,.sh,.sql,.dart,.go,.rs,.swift">
</footer>

<div id="scrim"></div>
<aside id="drawer" aria-label="المحادثات">
  <div class="dh"><b>💬 المحادثات</b><button class="ib" id="dClose" aria-label="إغلاق">✕</button></div>
  <button class="btn s1 full" id="dNew">＋ محادثة جديدة</button>
  <input id="cq" type="text" placeholder="🔎 ابحث في المحادثات" autocomplete="off">
  <div id="clist"></div>
  <div class="df">
    <button class="ib" id="dExport">⬇ تصدير الحالية</button>
    <button class="ib" id="dClear">🗑 حذف الكل</button>
  </div>
  <div class="hint">Walow AI Code v1.5</div>
</aside>
<div id="pvBox">
  <div class="pvh"><b>▶ معاينة</b><button class="ib" id="pvClose">✕ إغلاق</button></div>
  <iframe id="pvFrame" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
</div>
<div id="sk"><h3>🎨 رسم الطفل ← صورة واقعية</h3>
<div class="hint">أرفق صورة الرسم (من الكاميرا أو المعرض). يُحوَّل إلى صورة واقعية بنفس الشكل بالضبط. لا وصف ولا توليد من الصفر.</div>
<div class="skb"><label>📷 اختر / صوّر الرسم<input type="file" id="skf" accept="image/*" hidden></label></div>
<input id="skn" placeholder="ملاحظة اختيارية (مثال: السيارة حمراء)">

<script>
(function(){
"use strict";

          set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const OWNER="محمد ولو أبو يوسف";
const SYS={
  chat:`أنت "Walow AI Code"، مساعد ذكي عربي طوّره ${OWNER}. أجب بوضوح وبالعربية ما لم يطلب المستخدم لغة أخرى. إذا سُئلت من أنت فعرّف بنفسك بإيجاز.`,

اكتب بالعربية.`
};
const HINTS={chat:"دردشة عامة",code:"وضع المبرمج: أكواد كاملة جاهزة",analyze:"وضع التحليل: ألصق كوداً أو أرفق ملفاً أو صورة خطأ"};

let mode=LS.get("wac_mode","chat");
if(!["chat","code","analyze"].includes(mode))mode="chat";
let history=[];      // {role, parts}
let pending=[];      // attachments
let busy=false;

/* ---------- helpers ---------- */
const SEND_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
const STOP_SVG='<svg viewBox="0 0 24 24" fill="#fff"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>';
const DOTS='<span class="dots"><span></span><span></span><span></span></span>';
const MODE_ICON={chat:"💬",code:"👨‍💻",analyze:"🔍"};
const EXT={html:"html",htm:"html",svg:"svg",js:"js",javascript:"js",jsx:"jsx",ts:"ts",typescript:"ts",tsx:"tsx",py:"py",python:"py",css:"css",json:"json",
  java:"java",kotlin:"kt",kt:"kt",cpp:"cpp","c++":"cpp",c:"c",cs:"cs",csharp:"cs",php:"php",bash:"sh",sh:"sh",shell:"sh",sql:"sql",dart:"dart",go:"go",
  rust:"rs",rs:"rs",swift:"swift",gd:"gd",gdscript:"gd",xml:"xml",yaml:"yml",yml:"yml",md:"md",markdown:"md",lua:"lua",rb:"rb",ruby:"rb"};
let chats=[],cur=null,ctrl=null;

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function tableHTML(block){
  const rows=block.trim().split("\n").map(r=>r.trim());
  if(rows.length<2||!/^\|[\s:|-]+\|?$/.test(rows[1]))return null;
  const cells=r=>r.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
  let h='<div class="tw"><table><thead><tr>'+cells(rows[0]).map(c=>"<th>"+c+"</th>").join("")+"</tr></thead><tbody>";
  for(const r of rows.slice(2))h+="<tr>"+cells(r).map(c=>"<td>"+c+"</td>").join("")+"</tr>";
  return h+"</tbody></table></div>\n";
}
const MODE_NAME={chat:"دردشة",code:"مبرمج",analyze:"تحليل كود"};
function inline(t){
  t=esc(t);
  t=t.replace(/\[\[chat:([a-z0-9]{3,20})\]\]/g,(m,id)=>{const c=chats.find(x=>x.id===id);return c?'<button class="lnk" data-gochat="'+id+'">📂 '+esc(c.title)+'</button>':""});
  t=t.replace(/\[\[mode:(chat|code|analyze)\]\]/g,(m,k)=>'<button class="lnk" data-gomode="'+k+'">'+MODE_ICON[k]+' '+MODE_NAME[k]+'</button>');
  t=t.replace(/\[\[(?:chat|mode):[^\]]*\]\]/g,"");
  t=t.replace(/`([^`\n]+)`/g,'<code class="i">$1</code>');
  t=t.replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>");
  t=t.replace(/(^\|.*\|[ \t]*(?:\n|$))+/gm,blk=>tableHTML(blk)||blk);
  const lines=t.split("\n");let out="",inList=false;
  for(const ln of lines){
    let m;
    if((m=ln.match(/^\s*[-*•]\s+(.*)$/))||(m=ln.match(/^\s*\d+[.)]\s+(.*)$/))){
      if(!inList){out+="<ul>";inList=true}
      out+="<li>"+m[1]+"</li>";continue;
    }
    if(inList){out+="</ul>";inList=false}
    if(ln.startsWith('<div class="tw">')){out+=ln;continue}
    if((m=ln.match(/^#{1,2}\s+(.*)$/)))out+="<h3>"+m[1]+"</h3>";
    else if((m=ln.match(/^#{3,6}\s+(.*)$/)))out+="<h4>"+m[1]+"</h4>";
    else if(ln.trim()==="")out+='<i class="sp"></i>';
    else out+=ln+"<br>";
  }
  if(inList)out+="</ul>";
  return out.replace(/(<br>|<i class="sp"><\/i>)+$/,"");
}
function render(text){
  let html="",last=0;
  const re=/```([\w+#.-]*)[^\S\n]*\n?([\s\S]*?)(?:```|$)/g;let m;
  while((m=re.exec(text))!==null){
    html+=inline(text.slice(last,m.index));
    const lang=(m[1]||"").toLowerCase(),code=m[2].replace(/\n$/,"");
    const runnable=/^(html?|svg)$/.test(lang)||/^\s*(<!doctype html|<html)/i.test(code);
    html+=`<div class="code" data-lang="${esc(lang)}"><div class="ch"><span>${esc(m[1]||"code")}</span><span class="bt">${runnable?'<button data-run>▶ تشغيل</button>':''}<button data-dl>⬇ تنزيل</button><button data-copy>نسخ</button></span></div><pre><code>${esc(code)}</code></pre></div>`;
    last=re.lastIndex;
    if(m[0]==="")re.lastIndex++;
  }
  html+=inline(text.slice(last));
  return html;
}
function scrollDown(force){const e=$("#msgs");if(force||e.scrollHeight-e.scrollTop-e.clientHeight<180)e.scrollTop=e.scrollHeight}
function clearHello(){const h=$("#msgs .hello");if(h)h.remove()}
function addMsg(cls,html){
  clearHello();
  const d=document.createElement("div");d.className="m "+cls;d.innerHTML=html;
  $("#msgs").appendChild(d);scrollDown(true);return d;
}
function addBot(html){return addMsg("b",'<div class="mb">'+html+'</div>')}
function bodyOf(d){return d.querySelector(".mb")}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),2300)}
function copyText(text,btn){
  const done=()=>{if(btn){const o=btn.dataset.o||btn.textContent;btn.dataset.o=o;btn.textContent="تم ✔";setTimeout(()=>btn.textContent=o,1400)}};
  const legacy=()=>{const t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();try{document.execCommand("copy")}catch(_){}t.remove();done()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,legacy);else legacy();
}
function download(name,text,type){
  const b=new Blob([text],{type:(type||"text/plain")+";charset=utf-8"});
  const u=URL.createObjectURL(b);const a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),3000);
}
function safeName(s){return(s||"chat").replace(/[\\/:*?"<>|\n]+/g," ").trim().slice(0,40)||"chat"}

}

  <div class="chips">

  <span class="tip">تبديل الوضع (دردشة / مبرمج / تحليل) يغيّر أسلوب الرد فقط، والمحادثة تبقى كما هي. وكل محادثاتك محفوظة في ☰</span>`;
  e.appendChild(d);

function syncTabs(){

function setMode(m){

  if(cur){cur.mode=m;if(chats.includes(cur)&&cur.history.length)persist()}

/* ---------- app self-knowledge ---------- */
function agoText(ts){
  const a=new Date(ts),n=new Date();
  const d=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate()))/864e5);
  return d<=0?"اليوم":d===1?"أمس":"قبل "+d+" أيام";
}
function appInfo(){
  let t=`

معلومات عن التطبيق الذي تعمل داخله (Walow AI Code):
- أزرار الأوضاع أعلى الشاشة: 💬 دردشة، 👨‍💻 مبرمج (يكتب أكواداً كاملة)، 🔍 تحليل كود (يشرح ويصلح الأخطاء). تبديل الوضع يغيّر أسلوب الرد فقط والمحادثة تبقى كما هي.
- زر ☰ يفتح المحادثات المحفوظة (بحث، إعادة تسمية، حذف، تصدير). زر ＋ محادثة جديدة. زر ⚙ لتغيير المزوّد (Gemini / OpenRouter / Claude) والنموذج ومفتاحه.
- زر 📎 لإرفاق صورة أو ملف كود.
- تحت كل كتلة كود: ▶ تشغيل (لأكواد HTML) و ⬇ تنزيل و نسخ. تحت كل رد: 📋 نسخ الرد و 🔄 إعادة توليد. أثناء الرد يتحول زر الإرسال إلى ■ لإيقافه.
- التطبيق لا يولّد صوراً ولا يستطيع تعديل نفسه أو ملفاته. لكنه يعرض تلقائياً صوراً حقيقية من Wikimedia Commons تحت إجابتك عندما يسأل المستخدم عن زي أو منظر أو مكان في وضع الدردشة، فاشرح التفاصيل بوضوح (الاسم، الأصل، الألوان، المناسبات، الموقع) ولا تضع روابط صور من عندك.
عندما يناسب سؤال المستخدم ميزة في التطبيق فأرشده إليها باختصار. وإن سُئلت من أين تعرف ذلك فقل إنها معلومات مدمجة في التطبيق ولا تنسبها للمستخدم. ويمكنك إدراج زر قابل للضغط بكتابة العلامة كما هي حرفياً: [[mode:code]] أو [[mode:analyze]] أو [[mode:chat]].`;
  const list=chats.filter(c=>c!==cur&&c.history.length).sort((a,b)=>b.ts-a.ts).slice(0,15);
  if(list.length){
    t+="\nلفتح محادثة محفوظة انسخ العلامة المكتوبة أمامها كما هي بالضبط ولا تغيّر فيها حرفاً. المحادثات المحفوظة الأخرى (الأحدث أولاً):\n"+list.map(c=>"- "+c.title.replace(/[\[\]\n]/g," ").slice(0,50)+" ("+agoText(c.ts)+"): [[chat:"+c.id+"]]").join("\n");
  }
  return t;
}

/* ---------- chats ---------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function textOf(h){return h.parts.map(p=>p.text||"").join("\n")}
function slim(h){return h.map(x=>({role:x.role,parts:x.parts.map(p=>p.inlineData?{text:"[صورة مرفقة]"}:p)}))}
function persist(){
  const list=chats.filter(c=>c.history.length).sort((a,b)=>b.ts-a.ts).slice(0,80)
    .map(c=>({id:c.id,title:c.title,mode:c.mode,ts:c.ts,history:slim(c.history),imgs:c.imgs||{}}));
  for(let n=list.length;n>=0;n--){
    try{
      localStorage.setItem("wac_chats",JSON.stringify(list.slice(0,n)));
      if(n<list.length){const keep=new Set(list.slice(0,n).map(c=>c.id));chats=chats.filter(c=>keep.has(c.id)||c===cur)}
      return;
    }catch(e){}
  }
}
function newDraft(){
  const m=LS.get("wac_mode","chat");
  cur={id:uid(),title:"محادثة جديدة",mode:["chat","code","analyze"].includes(m)?m:"chat",ts:Date.now(),history:[]};
  history=cur.history;mode=cur.mode;
}
function loadChats(){
  try{chats=JSON.parse(LS.get("wac_chats","[]"))||[]}catch(e){chats=[]}
  chats=chats.filter(c=>c&&c.id&&Array.isArray(c.history)&&c.history.length);
  if(!chats.length){
    try{
      const old=JSON.parse(LS.get("wac_hist","[]"))||[];
      if(old.length){
        const f=old.find(h=>h.role==="user");
        const lt=f?(f.parts[f.parts.length-1].text||""):"";
        chats.push({id:uid(),title:(lt.replace(/\s+/g," ").trim().slice(0,42)||"محادثة سابقة"),mode:"chat",ts:Date.now(),history:old});
        persist();
      }
    }catch(e){}
  }
}
function userHTML(h){
  let tags="",txt="";
  h.parts.forEach((p,i)=>{
    if(p.inlineData||p.text==="[صورة مرفقة]")tags+='<span class="fileTag">🖼 صورة</span> ';
    else if(p.text&&p.text.startsWith("الملف: ")&&i<h.parts.length-1)tags+='<span class="fileTag">'+esc(p.text.slice(7).split("\n")[0])+'</span> ';
    else txt+=(txt?"\n":"")+(p.text||"");
  });
  return(tags?'<div class="thumbs">'+tags+'</div>':"")+esc(txt).replace(/\n/g,"<br>");
}
function renderChat(){
  $("#msgs").innerHTML="";
  if(!history.length){showHello();return}
  history.forEach((h,i)=>{
    if(h.role==="user")addMsg("u",userHTML(h));
    else{
      const b=addBot(render(textOf(h)));b._raw=textOf(h);
      const im=cur&&cur.imgs&&cur.imgs[i];
      if(im&&im.list&&im.list.length)mountGallery(bodyOf(b),im.list,im.q);
      addActs(b,i===history.length-1);
    }
  });
  scrollDown(true);
}
function openChat(c){
  cur=c;history=c.history;mode=c.mode||"chat";
  LS.set("wac_cur",c.id);pending=[];refreshPrev();
  syncTabs();renderChat();
}
function ensureChat(text){
  if(!chats.includes(cur))chats.push(cur);
  if(!cur.history.length)cur.title=((text||"محادثة").replace(/\s+/g," ").trim().slice(0,42))||"محادثة";
  cur.mode=mode;LS.set("wac_cur",cur.id);
}
function startNew(){
  if(busy){toast("انتظر انتهاء الرد أو اضغط إيقاف");return}
  if(history.length){newDraft();LS.set("wac_cur","");pending=[];refreshPrev();syncTabs();renderChat()}
  closeDrawer();
}
function relTime(ts){
  const d=new Date(ts),n=new Date(),p=x=>String(x).padStart(2,"0");
  return d.toDateString()===n.toDateString()?p(d.getHours())+":"+p(d.getMinutes()):d.getDate()+"/"+(d.getMonth()+1);
}
function renderList(){
  const q=$("#cq").value.trim().toLowerCase();
  const list=chats.filter(c=>c.history.length).sort((a,b)=>b.ts-a.ts)
    .filter(c=>!q||c.title.toLowerCase().includes(q)||c.history.some(h=>textOf(h).toLowerCase().includes(q)));
  const box=$("#clist");
  if(!list.length){box.innerHTML='<div class="empty">'+(q?"لا نتائج.":"لا توجد محادثات محفوظة بعد.")+'</div>';return}
  box.innerHTML=list.map(c=>`<div class="ci${c===cur?" on":""}" data-id="${c.id}"><div class="ct"><b>${esc(c.title)}</b><small>${MODE_ICON[c.mode]||"💬"} ${relTime(c.ts)} · ${Math.ceil(c.history.length/2)} رسالة</small></div><div class="ca"><button data-ren aria-label="إعادة تسمية">✏</button><button data-del aria-label="حذف">🗑</button></div></div>`).join("");
}
function openDrawer(){$("#cq").value="";renderList();$("#drawer").classList.add("on");$("#scrim").classList.add("on")}
function closeDrawer(){$("#drawer").classList.remove("on");$("#scrim").classList.remove("on")}
function exportChat(){
  if(!history.length){toast("المحادثة فارغة");return}
  let md="# "+cur.title+"\n\n";
  history.forEach(h=>{md+=(h.role==="user"?"## 🧑 أنت\n\n":"## 🤖 Walow AI Code\n\n")+textOf(h)+"\n\n"});
  download(safeName(cur.title)+".md",md,"text/markdown");
  toast("تم تصدير المحادثة");
}

function skRender(){
  let h="";
  if(skImg)h+=`<figure><img src="${skImg.url}" alt=""><figcaption>الرسم الأصلي</figcaption></figure>`;
  if(skOut)h+=`<figure><img src="${skOut.url}" alt=""><figcaption>النتيجة الواقعية</figcaption></figure><div class="skb"><button id="skdl">⬇ حفظ الصورة</button></div>`;
  $("#skim").innerHTML=h;
}
function skPrompt(note){
  return "Convert this child's drawing into a photorealistic photograph. Keep the EXACT same design, composition, proportions and structure as the drawing: every shape, part and count must stay as drawn (for example if a car has only two wheels and square shapes, the realistic result must also have exactly two wheels and square shapes). Do not add, remove, fix or 'correct' any part. Only change the rendering style to look real (materials, lighting, textures, realistic background). Output one image."+(note?" Extra note from the user: "+note:"");
}
async function skRun(){
  if(!skImg){skStatus("اختر صورة الرسم أولاً.");return}
  const key=getKey("gemini").trim();
  if(!key){skStatus("أضف مفتاح Gemini من ⚙ الإعدادات.");return}
  skOut=null;skRender();$("#skgo").disabled=true;
  skCtrl=new AbortController();
  const body={contents:[{parts:[{inlineData:{mimeType:skImg.mime,data:skImg.data}},{text:skPrompt($("#skn").value.trim())}]}],generationConfig:{responseModalities:["IMAGE","TEXT"]}};
  let lastErr="";
  try{
    for(const m of SK_MODELS){
      skStatus("⏳ جارٍ التحويل بنموذج "+m+" ...");
      let r;
      try{
        r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify(body),signal:skCtrl.signal});
      }catch(e){if(e.name==="AbortError")return;lastErr="تعذّر الاتصال بالشبكة";continue}
      let j=null;try{j=await r.json()}catch(e){}
      if(!r.ok){
        const msg=(j&&j.error&&j.error.message)||("HTTP "+r.status);
        lastErr=r.status===429||/quota|limit/i.test(msg)?"نموذج الصور غير متاح على الحصة المجانية لمفتاحك أو بلغت الحد (قد يتطلب تفعيل الفوترة في Google).":r.status===404?"النموذج "+m+" غير متوفر.":msg.slice(0,160);
        continue;
      }
      const parts=(j&&j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
      const ip=parts.find(x=>x.inlineData&&x.inlineData.data);
      if(ip){
        const mime=ip.inlineData.mimeType||"image/png";
        skOut={url:"data:"+mime+";base64,"+ip.inlineData.data,mime};
        skRender();skStatus("✅ تم. قارن النتيجة بالرسم الأصلي.");return;
      }
      const tx=parts.map(x=>x.text||"").join(" ").trim();
      lastErr=tx?("لم يُرجع النموذج صورة: "+tx.slice(0,140)):"لم يُرجع النموذج صورة (قد تكون حُجبت لأسباب أمان).";
    }
    skStatus("❌ "+lastErr);
  }finally{$("#skgo").disabled=false;skCtrl=null}
}
function skDownload(){
  if(!skOut)return;
  const a=document.createElement("a");a.href=skOut.url;a.download="walow-realistic."+(skOut.mime.includes("jpeg")?"jpg":"png");
  document.body.appendChild(a);a.click();a.remove();
}

function refreshPrev(){

  pending.forEach((a,i)=>{
    const w=document.createElement("div");w.className="pv";
    w.innerHTML=a.kind==="image"?`<img src="${a.url}">`:`<span class="fileTag">${esc(a.name)}</span>`;
    const x=document.createElement("b");x.textContent="×";x.onclick=()=>{pending.splice(i,1);refreshPrev()};
    w.appendChild(x);p.appendChild(w);
  });
}
function readImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("تعذّرت قراءة الصورة"));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error("صيغة الصورة غير مدعومة"));
      img.onload=()=>{
        const MAX=1600;let w=img.width,h=img.height;
        const k=Math.min(1,MAX/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
        const c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        const url=c.toDataURL("image/jpeg",.85);
        res({kind:"image",mime:"image/jpeg",data:url.split(",")[1],url});
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function readText(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("تعذّرت قراءة الملف"));
    fr.onload=()=>res({kind:"text",name:file.name,text:String(fr.result).slice(0,200000)});
    fr.readAsText(file);
  });
}
async function onFiles(files){
  for(const f of files){
    try{
      if(f.type.startsWith("image/"))pending.push(await readImage(f));
      else pending.push(await readText(f));
    }catch(e){addMsg("b err",esc(e.message))}
  }
  refreshPrev();
}

function explainError(status,msg){
  let tip="";
  if(/API key not valid|API_KEY_INVALID/i.test(msg))tip="المفتاح غير صالح. أنشئ مفتاحاً جديداً وتأكد أنه للمزوّد المختار.";
  else if(status===401||status===403)tip="المفتاح مرفوض أو لا يملك صلاحية. تأكد أنه مفتاح المزوّد المختار.";
  else if(status===402)tip="رصيدك لا يكفي لهذا النموذج. اختر نموذجاً مجانياً أو اشحن الرصيد.";
  else if(status===404)tip="اسم النموذج غير صحيح أو لم يعد متاحاً. اختر نموذجاً آخر من ⚙ الإعدادات.";
  else if(status===429)tip="تجاوزت الحد المسموح. انتظر قليلاً أو جرّب نموذجاً آخر.";
  else if(status===400)tip="الطلب مرفوض (ربما الملف كبير، أو النموذج لا يدعم الصور، أو المفتاح خاطئ).";
  else if(status>=500)tip="مشكلة مؤقتة عند المزوّد. أعد المحاولة بعد قليل.";
  return `<b>خطأ ${status||""}</b><br>${tip}<br><small dir="ltr" style="color:#ffb3be">${esc(msg||"")}</small>`;
}
async function readSSE(res,onData){
  const reader=res.body.getReader();const dec=new TextDecoder();let buf="";
  while(true){
    const {done,value}=await reader.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf("\n"))>=0){
      const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
      if(!line.startsWith("data:"))continue;
      const js=line.slice(5).trim();if(!js||js==="[DONE]")continue;
      let j;try{j=JSON.parse(js)}catch(e){continue}
      onData(j);
    }
  }
}
async function streamAI(onText,modelOverride){
  const p=getProv(),key=getKey(p).trim(),model=(modelOverride||getModel(p)).trim();
  const sys=(SYS[mode]||SYS.chat)+appInfo()+"\nالنموذج الذي يشغّلك حالياً: "+model+".";
  let url,headers,body;
  if(p==="gemini"){
    url=`${API}/${encodeURIComponent(model)}:streamGenerateContent?alt=sse`;
    headers={"Content-Type":"application/json","x-goog-api-key":key};
    body={systemInstruction:{parts:[{text:sys}]},contents:history,
      generationConfig:{temperature:mode==="chat"?0.8:0.4}};
  }else if(p==="openrouter"){
    url="https://openrouter.ai/api/v1/chat/completions";
    headers={"Content-Type":"application/json","Authorization":"Bearer "+key,"X-Title":"Walow AI Code"};
    body={model,stream:true,messages:[{role:"system",content:sys}].concat(toOpenAI())};
  }else{
    url="https://api.anthropic.com/v1/messages";
    headers={"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"};
    body={model,max_tokens:8192,stream:true,system:sys,messages:toAnthropic()};
  }
  let res;
  try{res=await fetch(url,{method:"POST",headers,body:JSON.stringify(body),signal:ctrl?ctrl.signal:undefined})}
  catch(e){if(e&&e.name==="AbortError")throw e;const err=new Error("تعذّر الاتصال بالإنترنت أو بالمزوّد.");err.status=0;throw err}
  if(!res.ok){
    let msg="";
    try{const j=await res.json();msg=(j.error&&j.error.message)||JSON.stringify(j)}catch(e){msg=res.statusText}
    const err=new Error(msg);err.status=res.status;throw err;
  }
  let full="",blocked="";
  await readSSE(res,j=>{
    if(p==="gemini"){
      if(j.promptFeedback&&j.promptFeedback.blockReason)blocked=j.promptFeedback.blockReason;
      const c=j.candidates&&j.candidates[0];
      if(c&&c.content&&c.content.parts){for(const q of c.content.parts){if(q.text){full+=q.text;onText(full)}}}
    }else if(p==="openrouter"){
      if(j.error){const er=new Error(j.error.message||"خطأ");er.status=Number(j.error.code)||0;throw er}
      const d=j.choices&&j.choices[0]&&j.choices[0].delta;
      if(d&&d.content){full+=d.content;onText(full)}
    }else{
      if(j.type==="error"){const er=new Error((j.error&&j.error.message)||"خطأ");er.status=0;throw er}
      if(j.type==="content_block_delta"&&j.delta&&j.delta.type==="text_delta"){full+=j.delta.text;onText(full)}
    }
  });
  if(!full&&blocked){const err=new Error("حُجب الطلب: "+blocked);err.status=400;throw err}
  if(!full){const err=new Error("لم يصل رد من النموذج.");err.status=0;throw err}
  return full;
}

const IMG_WORDS=new Set(["زي","ازياء","أزياء","لباس","ملابس","ثياب","ثوب","عباءة","عباءه","عباية","منظر","مناظر","طبيعة","طبيعه","معلم","معالم","شلال","شلالات","شاطئ","صورة","صوره","صور","سياحي","سياحية"]);
function wantsImages(text){
  return(text||"").split(/[^؀-ۿa-zA-Z0-9]+/).some(w=>{
    if(!w)return false;
    return IMG_WORDS.has(w)||IMG_WORDS.has(w.replace(/^(وبال|وال|بال|لل|ال|و|ب|ل)/,""));
  });
}
function lastUserMsg(){for(let i=history.length-1;i>=0;i--)if(history[i].role==="user")return history[i];return null}
function hasImgPart(h){return!!h&&h.parts.some(p=>p.inlineData||p.text==="[صورة مرفقة]")}
function userTextOf(h){
  if(!h)return"";
  const t=h.parts.filter(p=>p.text&&!p.text.startsWith("الملف: ")&&p.text!=="[صورة مرفقة]").map(p=>p.text);
  return t[t.length-1]||"";
}
async function askOnce(prompt,model){
  const p=getProv(),key=getKey(p).trim();
  model=(model||getModel(p)).trim();
  const c=new AbortController(),tm=setTimeout(()=>c.abort(),15000);
  try{
    let url,headers,body,pick;
    if(p==="gemini"){
      url=`${API}/${encodeURIComponent(model)}:generateContent`;
      headers={"Content-Type":"application/json","x-goog-api-key":key};
      body={contents:[{role:"user",parts:[{text:prompt}]}],generationConfig:{temperature:0}};
      pick=j=>j.candidates[0].content.parts.map(x=>x.text||"").join("");
    }else if(p==="openrouter"){
      url="https://openrouter.ai/api/v1/chat/completions";
      headers={"Content-Type":"application/json","Authorization":"Bearer "+key,"X-Title":"Walow AI Code"};
      body={model,temperature:0,messages:[{role:"user",content:prompt}]};
      pick=j=>j.choices[0].message.content;
    }else{
      url="https://api.anthropic.com/v1/messages";
      headers={"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"};
      body={model,max_tokens:60,messages:[{role:"user",content:prompt}]};
      pick=j=>j.content[0].text;
    }
    const r=await fetch(url,{method:"POST",headers,body:JSON.stringify(body),signal:c.signal});
    if(!r.ok)return"";
    return String(pick(await r.json())||"").trim();
  }catch(e){return""}
  finally{clearTimeout(tm)}
}
async function imageQuery(userText,model){
  const out=await askOnce("Convert the user's question into a short English image-search phrase (2 to 6 words) for Wikimedia Commons, naming the specific place, traditional costume or scene they ask about. If the question is NOT about clothing/costumes or about a place/landscape/scenery, answer exactly: NONE. Output only the phrase, nothing else.\nQuestion: "+userText.slice(0,300),model);
  const q=out.split("\n")[0].replace(/["'`*.:]/g,"").trim();
  if(!q||/^none\b/i.test(q)||q.length>80)return null;
  return q;
}
function plain(h){
  return String(h||"").replace(/<[^>]*>/g," ").replace(/&quot;/g,'"').replace(/&#0?39;/g,"'").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&").replace(/\s+/g," ").trim();
}
function capOf(d,o,t){const bad=x=>!x||/^https?:\/\//i.test(x)||/\.(jpe?g|png|webp)$/i.test(x)||(x.length>60&&!/\s/.test(x));const f=bad(d)?(bad(o)?t:o):d;return f.slice(0,200)}
async function fetchCommons(q){
  const u="https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=12"
    +"&gsrsearch="+encodeURIComponent(q+" filetype:bitmap")
    +"&prop=imageinfo&iiprop="+encodeURIComponent("url|mime|extmetadata")+"&iiurlwidth=700"
    +"&iiextmetadatafilter="+encodeURIComponent("ImageDescription|Artist|LicenseShortName|ObjectName");
  const r=await fetch(u);
  if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();
  const pages=j&&j.query&&j.query.pages?Object.values(j.query.pages):[];
  return pages.sort((a,b)=>(a.index||0)-(b.index||0)).map(pg=>{
    const ii=pg.imageinfo&&pg.imageinfo[0];
    if(!ii||!/^image\/(jpeg|png|webp)$/.test(ii.mime||""))return null;
    const md=ii.extmetadata||{},g=k=>md[k]&&md[k].value;
    const title=(pg.title||"").replace(/^File:/,"").replace(/\.[a-z0-9]+$/i,"").replace(/_/g," ");
    const t=ii.thumburl||ii.url||"";
    if(!/^https:\/\//.test(t))return null;
    const u2=/^https:\/\//.test(ii.descriptionurl||"")?ii.descriptionurl:"";
    return{t,d:capOf(plain(g("ImageDescription")),plain(g("ObjectName")),title),a:plain(g("Artist")).slice(0,60),l:plain(g("LicenseShortName")).slice(0,30),u:u2};
  }).filter(Boolean).slice(0,5);
}

function maybeImages(bot,chat,idx,model){
  if(LS.get("wac_imgs","1")==="0"||mode!=="chat")return;
  const um=lastUserMsg();
  if(!um||hasImgPart(um))return;
  const text=userTextOf(um);
  if(!wantsImages(text))return;
  addImages(bot,chat,idx,text,model).catch(()=>{});
}
async function addImages(bot,chat,idx,userText,model){
  const msg=chat.history[idx];
  const q=await imageQuery(userText,model);
  if(!q)return;
  let list;
  try{list=await fetchCommons(q)}
  catch(e){
    if(bot.isConnected&&cur===chat&&chat.history[idx]===msg)bodyOf(bot).insertAdjacentHTML("beforeend",'<div class="hint">🖼 تعذّر جلب الصور الآن</div>');
    return;
  }
  if(!list.length||chat.history[idx]!==msg)return;
  chat.imgs=chat.imgs||{};chat.imgs[idx]={q,list};
  persist();
  if(bot.isConnected&&cur===chat)mountGallery(bodyOf(bot),list,q);
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function streamWithRetry(onText,body){
  const p=getProv(),main=getModel(p);
  const chain=[main];
  if(p==="gemini")["gemini-3.5-flash-lite","gemini-3.6-flash"].forEach(m=>{if(m!==main)chain.push(m)});
  const retryable=[429,500,502,503,504];
  const rounds=chain.length>1?2:3;let lastErr;
  for(let r=0;r<rounds;r++){
    for(let k=0;k<chain.length;k++){
      try{
        const txt=await streamAI(onText,chain[k]);
        body.dataset.model=chain[k];
        return txt;
      }catch(e){
        lastErr=e;
        if(!retryable.includes(e.status))throw e;
        const last=(r===rounds-1&&k===chain.length-1);
        if(!last){
          const nx=chain.length>1?chain[(k+1)%chain.length]:chain[0];
          body.innerHTML=DOTS+' الخدمة مشغولة، ننتقل إلى '+esc(nx)+'...';
          await sleep(k===chain.length-1||chain.length===1?1800:400);
        }
      }
    }
  }
  throw lastErr;
}

async function reply(o){
  o=o||{};
  document.querySelectorAll("[data-tmp]").forEach(x=>x.remove());
  const bot=addBot(DOTS),body=bodyOf(bot);
  setBusy(true);ctrl=new AbortController();
  let partial="";
  const ok=(txt,note,noImg)=>{
    history.push({role:"model",parts:[{text:txt}]});
    bot._raw=txt;
    if(note)body.insertAdjacentHTML("beforeend",note);
    if(o.regen)o.regen.el.remove();
    addActs(bot,true);
    cur.ts=Date.now();persist();
    if(!noImg)maybeImages(bot,cur,history.length-1,body.dataset.model);
  };
  const fail=(e,silent)=>{
    if(o.regen){
      bot.remove();history.push(o.regen.msg);o.regen.el.style.display="";
      if(o.regen.imgs){cur.imgs=cur.imgs||{};cur.imgs[o.regen.idx]=o.regen.imgs}

    if(o.userEl)o.userEl.remove();
    history.pop();
    if(o.text!=null){const i=$("#inp");i.value=o.text;i.dispatchEvent(new Event("input"))}
    pending=o.pending||[];refreshPrev();
    if(silent){bot.remove();return}
    bot.className="m b err";bot.dataset.tmp="1";body.innerHTML=explainError(e.status,e.message);
  };
  try{
    const full=await streamWithRetry(t=>{partial=t;body.innerHTML=render(t);scrollDown()},body);
    const um=body.dataset.model;
    ok(full,(um&&um!==getModel(getProv()))?'<div class="hint" dir="ltr">answered by '+esc(um)+' (main model was busy)</div>':"");
  }catch(e){
    if(e&&e.name==="AbortError"){
      if(partial.trim())ok(partial,'<div class="hint">⏹ أُوقف الرد</div>',true);
      else fail(e,true);
    }else fail(e,false);
  }finally{
    setBusy(false);ctrl=null;scrollDown();
  }
}

async function send(){
  if(busy){stopGen();return}
  const inp=$("#inp");let text=inp.value.trim();
  if(!text&&!pending.length)return;
  if(!getKey(getProv()).trim()){
    addMsg("b err","أدخل مفتاح المزوّد أولاً من ⚙ الإعدادات.");openSettings();return;
  }
  if(!getModel(getProv()).trim()){
    addMsg("b err","اختر نموذجاً من ⚙ الإعدادات.");openSettings();return;
  }
  document.querySelectorAll("[data-tmp]").forEach(x=>x.remove());
  if(!text&&mode==="analyze")text="حلّل هذا وأصلح أي مشاكل فيه.";
  if(!text)text="ما الموجود في هذا المرفق؟ اشرحه لي.";

  const parts=[];let thumbs="",tags="";
  for(const a of pending){
    if(a.kind==="image"){parts.push({inlineData:{mimeType:a.mime,data:a.data}});thumbs+=`<img src="${a.url}">`}
    else{parts.push({text:`الملف: ${a.name}\n\`\`\`\n${a.text}\n\`\`\``});tags+=`<span class="fileTag">${esc(a.name)}</span> `}
  }
  parts.push({text});
  ensureChat(text);
  history.push({role:"user",parts});
  cur.ts=Date.now();
  const hadPending=pending.slice();
  const userEl=addMsg("u",(thumbs?`<div class="thumbs">${thumbs}</div>`:"")+(tags?`<div class="thumbs">${tags}</div>`:"")+esc(text).replace(/\n/g,"<br>"));
  inp.value="";inp.style.height="auto";pending=[];refreshPrev();
  await reply({userEl,text,pending:hadPending});
}

function regen(){
  if(busy)return;
  if(!history.length||history[history.length-1].role!=="model")return;
  const els=[...$("#msgs").querySelectorAll(".m.b")].filter(x=>x._raw!==undefined);
  const el=els[els.length-1];if(!el)return;
  const idx=history.length-1;
  const imgs=cur.imgs&&cur.imgs[idx];
  if(cur.imgs)delete cur.imgs[idx];
  const msg=history.pop();el.style.display="none";
  reply({regen:{msg,el,imgs,idx}});
}

/* ---------- settings ---------- */
let draft=null,curP="gemini",orModels=[],orLoaded=false;
function openSettings(){
  curP=getProv();
  draft={keys:{},models:{}};
  for(const p in PROV){draft.keys[p]=getKey(p);draft.models[p]=LS.get("wac_model_"+p,"")}
  $("#prov").value=curP;fillProv();
  $("#testOut").textContent="";
  $("#imgOn").checked=LS.get("wac_imgs","1")!=="0";
  if(!dlg.open)dlg.showModal();
}
function stash(){draft.keys[curP]=$("#key").value.trim();draft.models[curP]=$("#model").value.trim()}
function fillProv(){
  const P=PROV[curP];
  $("#key").value=draft.keys[curP]||"";$("#key").placeholder=P.ph;
  $("#keyHelp").textContent=P.help;
  $("#model").value=draft.models[curP]||P.def;
  $("#models").innerHTML=P.models.map(m=>`<option value="${m}">`).join("");
  $("#orBox").hidden=curP!=="openrouter";
  if(curP==="openrouter")loadOR(false);
}
async function loadOR(force){
  const box=$("#orList");
  if(orLoaded&&!force){renderOR();return}
  box.textContent="جارٍ تحميل النماذج...";
  try{
    const r=await fetch("https://openrouter.ai/api/v1/models");
    const j=await r.json();
    orModels=(j.data||[]).map(m=>({
      id:m.id,name:m.name||m.id,
      free:!!m.pricing&&Number(m.pricing.prompt)===0&&Number(m.pricing.completion)===0,
      img:!!(m.architecture&&(m.architecture.input_modalities||[]).includes("image"))
    }));
    orLoaded=true;renderOR();
  }catch(e){box.textContent="تعذّر تحميل القائمة. اكتب اسم النموذج يدوياً."}
}
function renderOR(){
  const q=$("#orq").value.trim().toLowerCase(),freeOnly=$("#orFree").checked;
  const list=orModels.filter(m=>(!freeOnly||m.free)&&(!q||m.id.toLowerCase().includes(q)||m.name.toLowerCase().includes(q))).slice(0,80);
  const box=$("#orList");
  box.innerHTML="";
  if(!list.length){box.textContent=freeOnly?"لا نتائج. ألغِ خيار (مجاني فقط) لرؤية كل النماذج.":"لا نتائج.";return}
  const cur=$("#model").value.trim();
  for(const m of list){
    const b=document.createElement("button");b.type="button";b.className="orm"+(m.id===cur?" on":"");
    b.innerHTML=`<span>${esc(m.id)}</span><b>${m.free?'<i>مجاني</i>':''}${m.img?'<i>🖼</i>':''}</b>`;
    b.onclick=()=>{$("#model").value=m.id;box.querySelectorAll(".orm").forEach(x=>x.classList.remove("on"));b.classList.add("on")};
    box.appendChild(b);
  }
}
async function testKey(){
  stash();
  const out=$("#testOut"),key=draft.keys[curP];
  if(!key){out.innerHTML='<span class="bad">أدخل المفتاح أولاً.</span>';return}
  const pre={gemini:"AIza",openrouter:"sk-or-",anthropic:"sk-ant-"}[curP];
  const warn=key.startsWith(pre)?"":`<br><span class="bad">تنبيه: المفتاح لا يبدأ بـ ${pre}، وقد لا يكون للمزوّد المختار.</span>`;
  out.textContent="جارٍ الاختبار...";
  let r;
  try{
    if(curP==="gemini")r=await fetch(API+"?pageSize=1",{headers:{"x-goog-api-key":key}});
    else if(curP==="openrouter")r=await fetch("https://openrouter.ai/api/v1/auth/key",{headers:{"Authorization":"Bearer "+key}});
    else r=await fetch("https://api.anthropic.com/v1/models?limit=1",{headers:{"x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"}});
  }catch(e){out.innerHTML='<span class="bad">✘ تعذّر الاتصال بالإنترنت.</span>';return}
  if(r.ok){out.innerHTML='<span class="ok">✔ المفتاح يعمل.</span>'+warn;return}
  let m="";try{const j=await r.json();m=(j.error&&j.error.message)||""}catch(e){}
  out.innerHTML=`<span class="bad">✘ فشل (${r.status}): ${esc(m)}</span>`+warn;
}
function getRecent(){try{return JSON.parse(LS.get("wac_recent","[]"))||[]}catch(e){return[]}}
function pushRecent(p,m){
  const r=getRecent().filter(x=>!(x.p===p&&x.m===m));r.unshift({p,m});
  LS.set("wac_recent",JSON.stringify(r.slice(0,8)));
}
function refreshQuick(){
  const q=$("#quick"),p=getProv(),m=getModel(p);
  const r=getRecent().filter(x=>PROV[x.p]&&x.m);
  if(m&&!r.some(x=>x.p===p&&x.m===m))r.unshift({p,m});
  q.innerHTML="";
  r.slice(0,8).forEach(x=>{
    const o=document.createElement("option");o.value=x.p+"|"+x.m;
    o.textContent=PROV[x.p].label.split(" ")[0]+" · "+x.m;q.appendChild(o);
  });
  const o=document.createElement("option");o.value="__set";o.textContent="⚙ إضافة / تغيير المزوّد...";q.appendChild(o);
  q.value=m?p+"|"+m:"__set";
}

$("#send").onclick=send;
$("#att").onclick=()=>$("#file").click();
$("#file").onchange=e=>{onFiles([...e.target.files]);e.target.value=""};
$("#inp").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(140,e.target.scrollHeight)+"px"});

$("#tabs").onclick=e=>{const t=e.target.closest(".tab");if(t)setMode(t.dataset.m)};
$("#newChat").onclick=startNew;
$("#menu").onclick=openDrawer;
$("#dClose").onclick=closeDrawer;
$("#scrim").onclick=closeDrawer;
$("#dNew").onclick=startNew;
$("#cq").oninput=renderList;
$("#dExport").onclick=exportChat;
$("#dClear").onclick=()=>{
  if(busy){toast("انتظر انتهاء الرد أو اضغط إيقاف");return}
  if(!chats.some(c=>c.history.length))return;
  if(confirm("حذف كل المحادثات المحفوظة؟ لا يمكن التراجع.")){
    chats=[];persist();newDraft();LS.set("wac_cur","");syncTabs();renderChat();renderList();
  }
};
$("#clist").addEventListener("click",e=>{
  const row=e.target.closest(".ci");if(!row)return;
  const c=chats.find(x=>x.id===row.dataset.id);if(!c)return;
  if(e.target.closest("[data-ren]")){
    const t=prompt("اسم المحادثة:",c.title);
    if(t&&t.trim()){c.title=t.trim().slice(0,60);persist();renderList()}
    return;
  }
  if(e.target.closest("[data-del]")){
    if(busy&&c===cur){toast("انتظر انتهاء الرد أو اضغط إيقاف");return}
    if(!confirm("حذف هذه المحادثة؟"))return;
    chats=chats.filter(x=>x!==c);persist();
    if(c===cur){newDraft();LS.set("wac_cur","");syncTabs();renderChat()}
    renderList();return;
  }
  if(busy&&c!==cur){toast("انتظر انتهاء الرد أو اضغط إيقاف");return}
  openChat(c);closeDrawer();
});
$("#pvClose").onclick=closePreview;
$("#lbx").onclick=closeLb;
$("#skOpen").onclick=openSk;$("#skx").onclick=closeSk;$("#skgo").onclick=skRun;
$("#skf").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{skImg=await readImage(f);skOut=null;skRender();skStatus("جاهز. اضغط «حوّل إلى واقعي».")}catch(er){skStatus("❌ "+er.message)}};
$("#skim").addEventListener("click",e=>{if(e.target.id==="skdl")skDownload()});
$("#lb").addEventListener("click",e=>{if(e.target.id==="lb")closeLb()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closePreview();closeDrawer();closeLb();closeSk()}});
$("#msgs").addEventListener("click",e=>{
  const fg=e.target.closest("figure[data-gi]");
  if(fg){const g=fg.closest(".gal"),m=g&&g._imgs&&g._imgs[Number(fg.dataset.gi)];if(m)openLb(m);return}
  const c=e.target.closest(".chip");
  if(c){$("#inp").value=c.dataset.q;$("#inp").focus();return}
  const box=e.target.closest(".code");
  if(box){
    const code=box.querySelector("code").textContent,lang=box.dataset.lang||"";
    if(e.target.closest("[data-run]")){openPreview(code,lang);return}
    if(e.target.closest("[data-dl]")){download("walow-code."+(EXT[lang]||"txt"),code);toast("تم تنزيل الملف");return}
    const b=e.target.closest("[data-copy]");if(b){copyText(code,b);return}
  }
  const gc=e.target.closest("[data-gochat]");
  if(gc){
    const c=chats.find(x=>x.id===gc.dataset.gochat);
    if(!c)return;
    if(busy){toast("انتظر انتهاء الرد أو اضغط إيقاف");return}
    openChat(c);return;
  }
  const gm=e.target.closest("[data-gomode]");
  if(gm){setMode(gm.dataset.gomode);toast("تم تفعيل وضع "+MODE_NAME[gm.dataset.gomode]);return}
  const cp=e.target.closest("[data-cp]");
  if(cp){const m=cp.closest(".m");copyText((m&&m._raw)||"",cp);return}
  if(e.target.closest("[data-regen]")){regen();return}
});
const dlg=$("#dlg");
$("#openSet").onclick=openSettings;
$("#closeSet").onclick=()=>dlg.close();
$("#prov").onchange=e=>{stash();curP=e.target.value;fillProv()};
$("#orq").oninput=renderOR;
$("#orFree").onchange=renderOR;
$("#orReload").onclick=()=>loadOR(true);
$("#saveSet").onclick=()=>{
  stash();
  for(const p in PROV){LS.set("wac_key_"+p,draft.keys[p]||"");LS.set("wac_model_"+p,draft.models[p]||"")}
  LS.set("wac_prov",curP);
  LS.set("wac_imgs",$("#imgOn").checked?"1":"0");
  const m=getModel(curP);if(m)pushRecent(curP,m);
  refreshQuick();dlg.close();
};
$("#test").onclick=testKey;
$("#quick").onchange=e=>{
  const v=e.target.value;
  if(v==="__set"){refreshQuick();openSettings();return}
  const k=v.indexOf("|"),p=v.slice(0,k),m=v.slice(k+1);
  LS.set("wac_prov",p);LS.set("wac_model_"+p,m);refreshQuick();
};

/* ---------- app icon ---------- */
function logoSVG(id,rx,named){
  if(rx===undefined)rx=112;
  var open=named?'<g transform="translate(256 214) scale(.9) translate(-256 -256)">':'';
  var close=named?'</g><text x="256" y="372" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="76" letter-spacing="6" fill="#fff">WALOW</text><text x="256" y="428" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="34" letter-spacing="14" fill="#fff" fill-opacity=".85">AI CODE</text>':'';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">'
  +'<defs><linearGradient id="g'+id+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fd0ff"/><stop offset=".5" stop-color="#2f6bff"/><stop offset="1" stop-color="#7a4dff"/></linearGradient>'
  +'<radialGradient id="h'+id+'" cx=".25" cy=".15" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>'
  +'<rect width="512" height="512" rx="'+rx+'" fill="url(#g'+id+')"/>'
  +'<rect width="512" height="512" rx="'+rx+'" fill="url(#h'+id+')"/>'
  +open+'<path d="M206 172L122 256L206 340" fill="none" stroke="#fff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>'
  +'<path d="M306 172L390 256L306 340" fill="none" stroke="#fff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>'
  +'<path d="M256 178C259 228 284 253 334 256C284 259 259 284 256 334C253 284 228 259 178 256C228 253 253 228 256 178Z" fill="#fff"/>'
  +close+'</svg>';
}
function setupIcons(){
  try{
    $("#hLogo").innerHTML=logoSVG("hd");
    const head=document.head;
    const fav=document.createElement("link");fav.rel="icon";fav.type="image/svg+xml";
    fav.href="data:image/svg+xml,"+encodeURIComponent(logoSVG("fv"));head.appendChild(fav);
    // PNG icons (full-bleed) for home screen + manifest
    const full=logoSVG("pn",0,true).replace("<svg ",'<svg width="512" height="512" ');
    const img=new Image();
    img.onload=()=>{
      try{
        const mk=s=>{const c=document.createElement("canvas");c.width=c.height=s;c.getContext("2d").drawImage(img,0,0,s,s);return c.toDataURL("image/png")};
        const p192=mk(192),p512=mk(512);
        const at=document.createElement("link");at.rel="apple-touch-icon";at.href=p512;head.appendChild(at);
        if(location.protocol==="http:"||location.protocol==="https:"){
          const mf={name:"Walow AI Code",short_name:"Walow Code",lang:"ar",dir:"rtl",
            start_url:location.href.split("#")[0],display:"standalone",
            background_color:"#050d24",theme_color:"#0b1530",
            icons:[{src:p192,sizes:"192x192",type:"image/png",purpose:"any maskable"},
                   {src:p512,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
          const l=document.createElement("link");l.rel="manifest";
          l.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:"application/manifest+json"}));
          head.appendChild(l);
        }
      }catch(e){}
    };
    img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(full);
  }catch(e){}
}

migrate();
loadChats();
{
  const sid=LS.get("wac_cur","");
  const found=chats.find(c=>c.id===sid)||chats.slice().sort((a,b)=>b.ts-a.ts)[0];
  if(found)openChat(found);else{newDraft();syncTabs();renderChat()}
}
setupIcons();
refreshQuick();
})();
